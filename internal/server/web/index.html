<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>文件服务器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%234f8cff' d='M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ============ 目录浏览视图 ============ -->
<div id="browse" class="view">
  <header class="toolbar">
    <div class="toolbar-main">
      <button id="btnHome" class="icon-btn brand-btn" title="回到根目录" aria-label="根目录">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      </button>
      <nav id="crumbs" class="crumbs" aria-label="面包屑"></nav>
    </div>
    <div class="toolbar-actions">
      <div class="searchbox" id="searchBox">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="searchInput" type="text" placeholder="搜索文件…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
        <button id="searchClear" class="search-clear hidden" title="清除搜索">✕</button>
      </div>
      <button id="btnRefresh" class="icon-btn" title="刷新 (F5)" aria-label="刷新">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg>
      </button>
      <div class="seg" role="group" aria-label="视图切换">
        <button id="btnGrid" class="seg-btn active" title="网格视图" aria-label="网格视图">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
        </button>
        <button id="btnList" class="seg-btn" title="列表视图" aria-label="列表视图">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
      <select id="sortSelect" class="sort-select" title="排序方式">
        <option value="name">名称</option>
        <option value="time">时间</option>
        <option value="size">大小</option>
      </select>
      <button id="btnOrder" class="icon-btn" title="切换升序/降序" aria-label="排序方向">
        <svg viewBox="0 0 24 24" class="order-asc"><path d="M6 20V4m0 0l-3.5 3.5M6 4l3.5 3.5M12 6h8M12 12h8M12 18h5"/></svg>
      </button>
      <button id="btnTheme" class="icon-btn" title="切换主题 (T)" aria-label="主题切换">
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M20 13.5A8.5 8.5 0 0 1 10.5 4 8.5 8.5 0 1 0 20 13.5z"/></svg>
      </button>
    </div>
  </header>

  <main id="main">
    <div id="skeleton" class="skeleton" aria-hidden="true"></div>
    <div id="grid" class="grid"></div>
    <div id="listView" class="list-view hidden">
      <table>
        <thead><tr><th class="col-name">名称</th><th class="col-size">大小</th><th class="col-time">修改时间</th><th class="col-act"></th></tr></thead>
        <tbody id="listBody"></tbody>
      </table>
    </div>
    <div id="empty" class="empty hidden">
      <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      <p id="emptyText">此文件夹为空</p>
    </div>
    <div id="loadMore" class="load-more hidden">
      <button id="btnLoadMore">加载更多</button>
      <span id="loadMoreInfo"></span>
    </div>
  </main>
</div>

<!-- ============ 预览视图 ============ -->
<div id="preview" class="view hidden">
  <header class="toolbar">
    <div class="toolbar-main">
      <button id="btnBack" class="icon-btn" title="返回" aria-label="返回">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="pv-title">
        <span id="pvName" class="pv-name"></span>
        <span id="pvMeta" class="pv-meta"></span>
      </div>
    </div>
    <div class="toolbar-actions">
      <button id="btnPvDownload" class="btn primary" title="下载此文件">
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
        下载
      </button>
    </div>
  </header>
  <main class="pv-main" id="pvMain"></main>
</div>

<!-- ============ 灯箱 ============ -->
<div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="图片预览">
  <div class="lb-top">
    <div class="lb-titles"><span id="lbName" class="lb-name"></span><span id="lbCount" class="lb-count"></span></div>
    <div class="lb-actions">
      <button class="icon-btn" id="lbRotate" title="旋转 (R)" aria-label="旋转">
        <svg viewBox="0 0 24 24"><path d="M20 8v6h-6M4 16v-6h6"/><path d="M6.3 6.3a8 8 0 0 1 11.9-.6L20 7.5M4 16.5l1.8 1.8a8 8 0 0 0 11.9-.6"/></svg>
      </button>
      <button class="icon-btn" id="lbZoomOut" title="缩小 (-)" aria-label="缩小">
        <svg viewBox="0 0 24 24"><path d="M8 12h8"/><circle cx="12" cy="12" r="8"/></svg>
      </button>
      <span id="lbZoomLabel" class="lb-zoom">100%</span>
      <button class="icon-btn" id="lbZoomIn" title="放大 (+)" aria-label="放大">
        <svg viewBox="0 0 24 24"><path d="M12 8v8M8 12h8"/><circle cx="12" cy="12" r="8"/></svg>
      </button>
      <button class="icon-btn" id="lbDownload" title="下载" aria-label="下载">
        <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0l-4-4m4 4l4-4M4 19h16"/></svg>
      </button>
      <button class="icon-btn" id="lbClose" title="关闭 (Esc)" aria-label="关闭">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>
  <div class="lb-stage">
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="上一张">‹</button>
    <div class="lb-img-wrap"><img id="lbImg" alt=""></div>
    <button class="lb-nav lb-next" id="lbNext" aria-label="下一张">›</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
