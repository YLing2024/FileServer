name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 三平台矩阵：ubuntu / macos / windows 都真跑 go test，任一红灯整体失败。
  # - ubuntu、windows 带 -race（macOS 上 race 需 cgo，改跑普通测试）
  # - vet + build 在各自原生环境运行，覆盖平台专属代码路径
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            race: "true"
          - os: windows-latest
            race: "true"
          - os: macos-latest
            race: "false"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt check
        shell: bash
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "未格式化文件:"; echo "$out"; exit 1; fi
      - name: go vet
        shell: bash
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          if [ "${{ matrix.race }}" = "true" ]; then
            go test -race ./...
          else
            go test ./...
          fi
      - name: go build
        shell: bash
        run: go build ./...

  # 交叉 job：证明五个目标（linux/darwin/windows 的 amd64+arm64）都能 vet/build。
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "未格式化文件:"; echo "$out"; exit 1; fi
      - name: cross vet/build (5 targets)
        run: |
          set -e
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${p%/*}"; arch="${p#*/}"
            echo "== $os/$arch =="
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go vet ./...
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o /tmp/fileserver-$os-$arch ./cmd/fileserver
          done
      - name: coverage
        run: make cover

  # 前端 job：独立于 Go 矩阵，证明 pnpm 锁文件可复现、四段检查全绿，
  # 且构建产物与仓库中提交的 internal/server/web-dist 完全一致。
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: pnpm install --frozen-lockfile
        run: pnpm install --frozen-lockfile
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        run: pnpm lint
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build
      - name: verify committed build output
        working-directory: .
        run: git diff --exit-code internal/server/web-dist

  # 正确性 lint：只开 .golangci.yml 声明的规则，版本钉死。
  # 分别在 linux 原生与 windows 交叉下各跑一次，覆盖两套 build tag 分支。
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: amd64
